<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👊</text></svg>">
  <title>Not Fight Club</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>👊 Not Fight Club</h1>
  </header>

  <main id="app-container">
    
    <section id="screen-registration" class="screen">
      <h2>Fighter Registration</h2>
      <div class="form-group">
        <input type="text" id="reg-name" placeholder="Enter your fighter's name..." autocomplete="off">
        <button id="btn-register">Enter the Club</button>
      </div>
    </section>

    <section id="screen-home" class="screen hidden">
      <h2>Welcome, <span id="home-player-name">Fighter</span>!</h2>
      <div class="menu-buttons">
        <button id="btn-start-battle" class="btn-primary">Start Battle ⚔️</button>
        <button id="btn-to-character">My Character 🛡️</button>
        <button id="btn-to-settings">Settings ⚙️</button>
      </div>
    </section>

    <section id="screen-character" class="screen hidden">
      <h2>Character Card</h2>
      
      <div class="character-profile">
        <img id="char-current-avatar" src="assets/avatars/ren.gif" alt="Current Avatar">
        <h3 id="char-player-name">Fighter</h3>
        <p class="stats">Wins: <span id="char-wins">0</span> | Losses: <span id="char-losses">0</span></p>
      </div>

      <div class="avatar-selection">
        <h4>Choose Your Fighter:</h4>
        <div class="avatar-grid">
          <img class="avatar-option" src="assets/avatars/ren.gif" data-avatar="assets/avatars/ren.gif" alt="Ren">
          <img class="avatar-option" src="assets/avatars/jon.gif" data-avatar="assets/avatars/jon.gif" alt="Jon">
          <img class="avatar-option" src="assets/avatars/gal.gif" data-avatar="assets/avatars/gal.gif" alt="Gal">
          <img class="avatar-option" src="assets/avatars/cho.gif" data-avatar="assets/avatars/cho.gif" alt="Cho">
          <img class="avatar-option" src="assets/avatars/boss.gif" data-avatar="assets/avatars/boss.gif" alt="Boss">
          <img class="avatar-option" src="assets/avatars/lodman.gif" data-avatar="assets/avatars/lodman.gif" alt="Lodman">
          <img class="avatar-option" src="assets/avatars/ryuken.gif" data-avatar="assets/avatars/ryuken.gif" alt="Ryuken">
        </div>
      </div>

      <button class="btn-back btn-character-back" style="background-color: #555; margin-top: 20px;">Back to Menu</button>
    </section>

    <section id="screen-settings" class="screen hidden">
      <h2>Settings</h2>
      <div class="form-group">
        <label for="settings-name" style="text-align: left; font-size: 14px; color: #aaa;">Change Fighter's Name:</label>
        <input type="text" id="settings-name" placeholder="Enter new name..." autocomplete="off">
        <button id="btn-save-settings">Save Changes 💾</button>
        <button id="btn-reset-game" style="background-color: #3e3e3e; margin-top: 10px;">Reset Progress 🔄</button>
        <button class="btn-back btn-settings-back" style="background-color: #555; margin-top: 20px;">Back to Menu</button>
      </div>
    </section>

    <section id="screen-battle" class="screen hidden">
      <h2>Battle Arena</h2>
      
      <div class="arena-container">
        <div class="fighter-card player-side">
          <h3>Your Fighter</h3>
          <img id="arena-player-avatar" src="assets/avatars/ren.gif" alt="Player">
          <div id="arena-player-name" class="fighter-name">Fighter</div>
        </div>

        <div class="vs-label">VS</div>

        <div class="fighter-card enemy-side">
          <h3>Enemy</h3>
          <img id="arena-enemy-avatar" src="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2280%22 x=%2215%22>❓</text></svg>" alt="Enemy">
          <div id="arena-enemy-name" class="fighter-name">Choose Opponent</div>
        </div>
      </div>

      <!-- Вибір супротивника (сюди JS підставить унікальних ворогів) -->
      <div class="enemy-selection">
        <h4>Select Your Target:</h4>
        <div class="enemy-grid"></div>
      </div>

      <!-- Кнопки дій на арені -->
      <div class="battle-actions">
        <button id="btn-fight-now" class="btn-primary" disabled style="margin-top: 15px; opacity: 0.5; cursor: not-allowed;">FIGHT! 👊</button>
        <button class="btn-back btn-battle-back" style="background-color: #555; margin-top: 10px; width: 100%;">Back to Menu</button>
      </div>
    </section>

  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
